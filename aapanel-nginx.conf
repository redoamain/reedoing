# Konfigurasi Reverse Proxy Nginx untuk aaPanel
# Letakkan di: aaPanel -> Website -> [Domain Anda] -> Reverse Proxy
# Atau masukkan langsung ke konfigurasi server block Nginx

location / {
    proxy_pass http://127.0.0.1:3303;
    proxy_http_version 1.1;
    
    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Headers untuk SvelteKit & identifikasi client
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Timeout
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
}
